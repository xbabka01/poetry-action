name: 'Setup python and poetry'
description: 'Set up Python and install Poetry'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  python_version:
    description: "The version of Python to set up"
    required: true
  poetry_version:
    description: "The version of Poetry to install, e.g. '2.1.3' or a pip specifier like '>=2,<3'. Latest if empty."
    required: false
    default: ""
outputs:
  python_version:
    description: "The installed Python version"
    value: ${{ steps.setup-python.outputs.python-version }}
runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python_version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install poetry ${{ inputs.poetry_version }}
      env:
        POETRY_VERSION: ${{ inputs.poetry_version }}
      run: |
        spec="poetry"
        if [[ -n "$POETRY_VERSION" ]]; then
          # Bare version numbers get "==", anything else is used as a pip specifier
          if [[ "$POETRY_VERSION" =~ ^[0-9] ]]; then
            spec="poetry==$POETRY_VERSION"
          else
            spec="poetry$POETRY_VERSION"
          fi
        fi
        python -m pip install --upgrade pip
        python -m pip install "$spec"
        poetry --version
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project false
        poetry config virtualenvs.path .virtualenvs
      shell: bash

name: 'Setup python and poetry'
description: 'Set up Python and install Poetry'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  python_version:
    description: "The version of Python to set up"
    required: true
  poetry_version:
    description: "The version of Poetry to install, e.g. '2.1.3' or a pip specifier like '>=2,<3'. Latest if empty."
    required: false
    default: ""
outputs:
  python_version:
    description: "The installed Python version"
    value: ${{ steps.setup-python.outputs.python-version }}
runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python_version }}
      id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install poetry ${{ inputs.poetry_version }}
      env:
        POETRY_VERSION: ${{ inputs.poetry_version }}
        PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        VIRTUALENVS_PATH: ${{ github.workspace }}/.virtualenvs
      run: |
        spec="poetry"
        if [[ -n "$POETRY_VERSION" ]]; then
          # Bare version numbers get "==", anything else is used as a pip specifier
          if [[ "$POETRY_VERSION" =~ ^[0-9] ]]; then
            spec="poetry==$POETRY_VERSION"
          else
            spec="poetry$POETRY_VERSION"
          fi
        fi
        # Install poetry into its own isolated environment so it doesn't clash with project dependencies
        if ! command -v pipx >/dev/null 2>&1; then
          "$PYTHON_PATH" -m pip install pipx
        fi
        pipx install --force --python "$PYTHON_PATH" "$spec"
        bin_dir="$(pipx environment --value PIPX_BIN_DIR)"
        echo "$bin_dir" >> "$GITHUB_PATH"
        export PATH="$bin_dir:$PATH"
        poetry --version
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project false
        poetry config virtualenvs.path "$VIRTUALENVS_PATH"
      shell: bash
